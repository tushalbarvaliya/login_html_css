<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modish's</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fasthand&family=Knewave&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1 id="titlehead">
          <span class="pink">M</span>odish <span class="pink">L</span>ogin
          <span class="pink">F</span>orm
        </h1>
      </header>
      <section id="login_containder">
        <div>
          <h3>
            <div>
                Login Here <img src="./down_hand.png" alt="" id="hand_down_icon" />
            </div>
          </h3>
          <div class="input">
            <label for="email">
              <img src="email_icon.png" alt="" srcset="" id="email_icon" />
              <input type="text" placeholder="Email" id="email" name="email" />
            </label>
          </div>
          <div class="input">
            <label for="password">
                <img src="./unlock.png" alt="" srcset="">
              <input
                type="text"
                placeholder="password"
                id="password"
                name="password"
              />
            </label>
          </div>
          <button type="submit">
            <img src="./login.png" alt="" />
          </button>
        </div>
      </section>
      <footer>
        <h6>
          &#169; Modish Login Form. All Right reserved | Design by
          <span class="pink">W3layouts</span>
        </h6>
      </footer>
    </main>
  </body>
</html>
